<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report real
         values; without it a notched phone reports 0 and the header sits under
         the cutout once rotated to landscape. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Simran &amp; Sachit — Royal Wedding Invitation</title>

    <!-- LCP. The largest thing painted on first load is the day palace plate
         behind the invitation card (it is full-bleed, so it is the LCP element
         on every viewport). Preloading EXACTLY that one asset — with the same
         `imagesrcset`/`imagesizes` the <picture> will use — lets the browser
         start the fetch ~1 render earlier and, because the candidate list
         matches, it does NOT download twice.

         Nothing else is preloaded: the other three hero videos and every
         below-the-fold plate stay on their normal lazy/preload="auto" paths, so
         this does not compete with them for bandwidth. -->
    <link rel="preload" as="image" type="image/webp"
          imagesrcset="/assets/scene1/day-image-512.webp 512w, /assets/scene1/day-image-768.webp 768w, /assets/scene1/day-image-1024.webp 1024w"
          imagesizes="100vw" fetchpriority="high" />

    <!-- Google Fonts for Royal Indian Wedding Theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#040711] text-[#f7f2e7] antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
